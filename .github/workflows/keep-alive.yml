# Render bepul tarifida server 15 daqiqa so'rov bo'lmasa uxlab qoladi.
# Bu workflow har ~10 daqiqada backendni "turtib", uni uyg'oq ushlab turadi.
name: Render uyg'otgich

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Backendni turtish
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://tez-pizza-api.onrender.com/api/health
